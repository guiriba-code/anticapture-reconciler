[project]
name = "anticapture-reconciler"
version = "0.2.0"
description = "Read-only reconciler that compares the public Anticapture API with on-chain data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["eth-abi>=5,<7", "eth-utils>=4,<7", "pycryptodome>=3.20"]

[project.scripts]
anticapture-reconciler = "reconciler.cli:main"

[tool.setuptools]
packages = ["reconciler"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
